<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Project Management - Dashboard</title>
    <link rel="shortcut icon" href="">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,400&amp;display=swap">
    <link rel="stylesheet" href="{% static 'assets/plugins/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <style>
        .password-requirements {
            font-size: 0.875rem;
            margin-top: 0.5rem;
            color: #6c757d;
        }
        .password-requirements ul {
            list-style: none;
            padding-left: 0;
            margin-top: 0.25rem;
        }
        .password-requirements li {
            margin-bottom: 0.25rem;
        }
        .valid-requirement {
            color: #28a745;
        }
        .invalid-requirement {
            color: #dc3545;
        }
    </style>


    <!--DataTable CSS-->
    <script src="https://code.jquery.com/jQuery-1.11.1.min.js"></script>
    <link rel="stylesheet" href="{% static 'assets/plugins/datatables/datatables.min.css' %}">
    <!--DataTable CSS end -->

</head>

<body>
    <div class="main-wrapper">

        <div class="page-wrapper">
            <div class="content container-fluid">

                <div class="row">
                    <div class="col-sm-12">
                        <div class="card ">
                            <div class="card-body ">
                                <form method="post" action="{% url 'reset_password' %}" enctype="multipart/form-data">
                                    {% csrf_token %}
                                    <div class="col-12">
                                        <h5 class="form-title"><span>Reset Password</span></h5>
                                    </div>
                                    <input type="email" class="form-control" name="email" value="{{ email }}" readonly>
                                    <br>
                                    <div class="form-group">
                                        <label for="password">Password</label>
                                        <input type="password" 
                                               class="form-control" 
                                               id="password" 
                                               name="password" 
                                               pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{8,}$"
                                               required
                                               oninput="validatePassword(this)"
                                        >
                                        <div class="password-requirements" id="password-requirements">
                                            Password must contain:
                                            <ul>
                                                <li id="length">❌ Minimum 8 characters</li>
                                                <li id="capital">❌ At least one capital letter</li>
                                                <li id="number">❌ At least one number</li>
                                                <li id="special">❌ At least one special character (!@#$%^&*)</li>
                                            </ul>
                                        </div>
                                        <div class="invalid-feedback">
                                            Please enter a valid password meeting all requirements.
                                        </div>
                                    </div>
                                    <br>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-success">Reset</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function validatePassword(input) {
                // Get the password value
                const password = input.value;
                
                // Define validation criteria
                const minLength = password.length >= 8;
                const hasCapital = /[A-Z]/.test(password);
                const hasNumber = /[0-9]/.test(password);
                const hasSpecial = /[!@#$%^&*]/.test(password);
                
                // Update requirement indicators
                updateRequirement('length', minLength);
                updateRequirement('capital', hasCapital);
                updateRequirement('number', hasNumber);
                updateRequirement('special', hasSpecial);
                
                // Check if all requirements are met
                const isValid = minLength && hasCapital && hasNumber && hasSpecial;
                input.setCustomValidity(isValid ? '' : 'Please meet all password requirements');
                
                // Check password match if confirm password is filled
                checkPasswordMatch();
            }
            
            function updateRequirement(id, isValid) {
                const element = document.getElementById(id);
                if (isValid) {
                    element.innerHTML = '✅ ' + element.innerHTML.substring(2);
                    element.classList.add('valid-requirement');
                    element.classList.remove('invalid-requirement');
                } else {
                    element.innerHTML = '❌ ' + element.innerHTML.substring(2);
                    element.classList.add('invalid-requirement');
                    element.classList.remove('valid-requirement');
                }
            }
            
            function checkPasswordMatch() {
                const password = document.getElementById('password');
                const confirmPassword = document.getElementById('confirm_password');
                const matchMessage = document.getElementById('password-match-message');
                
                if (confirmPassword.value === '') {
                    confirmPassword.setCustomValidity('');
                    matchMessage.style.display = 'none';
                    return;
                }
                
                if (password.value === confirmPassword.value) {
                    confirmPassword.setCustomValidity('');
                    matchMessage.style.display = 'none';
                } else {
                    confirmPassword.setCustomValidity('Passwords do not match');
                    matchMessage.style.display = 'block';
                }
            }
            </script>
        <script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>
        <script src="{% static 'assets/js/popper.min.js' %}"></script>
        <script src="{% static 'assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>
        <script src="{% static 'assets/plugins/slimscroll/jquery.slimscroll.min.js' %}"></script>
        <script src="{% static 'assets/plugins/apexchart/apexcharts.min.js' %}"></script>
        <script src="{% static 'assets/plugins/apexchart/chart-data.js' %}"></script>
        <script src="{% static 'assets/js/script.js' %}"></script>

        <!--DataTable JS Scripts -->
        <script src="{% static 'assets/plugins/datatables/datatables.min.js' %}"></script>
        <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
        <script type="text/javascript">
            $(document).ready(function () {
                $('#table_id').dataTable();
            });
        </script>
        <!--DataTable JS Scripts End -->
</body>

</html>
