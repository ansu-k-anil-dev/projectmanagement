{% extends 'base.html' %}
{% block content %}

    <div class="row">
        <div class="col-sm-12">
            <div class="card ">
                <div class="card-body ">
                    <form method="post" enctype="multipart/form-data" action="{% url 'add_presentation' group_id %}" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="col-12">
                            <h5 class="form-title"><span>Add Presntation Details</span></h5>
                        </div>

                        {{ presentation_form.as_p }}

                        <div class="col-12">
                            <button type="submit" class="btn btn-success">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
